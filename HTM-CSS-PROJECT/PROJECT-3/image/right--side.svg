<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

<!-- desk -->
<rect x="60" y="360" width="380" height="10" rx="3" fill="#2b3a4a"/>
<rect x="90" y="370" width="12" height="60" fill="#2b3a4a"/>
<rect x="398" y="370" width="12" height="60" fill="#2b3a4a"/>

<!-- chair -->
<path d="M330 300 Q330 260 300 260 L260 260 Q235 260 235 290 L235 340" stroke="#3d4f63" stroke-width="10" fill="none" stroke-linecap="round"/>

<!-- body -->
<path d="M215 345 Q215 300 270 300 Q325 300 325 345 L325 400 L215 400 Z" fill="#2f6fa8"/>
<rect x="215" y="345" width="110" height="18" fill="#26578a"/>

<!-- arms -->
<path d="M225 350 Q205 365 210 385" stroke="#e0a877" stroke-width="14" fill="none" stroke-linecap="round"/>
<path d="M315 350 Q335 365 330 385" stroke="#e0a877" stroke-width="14" fill="none" stroke-linecap="round"/>

<!-- head -->
<circle cx="270" cy="270" r="38" fill="#e0a877"/>
<path d="M232 262 Q270 210 308 262 Q310 235 270 228 Q230 235 232 262 Z" fill="#2b2118"/>

<!-- laptop -->
<g>
<rect x="230" y="358" width="90" height="6" rx="2" fill="#1f2a35"/>
<rect x="238" y="318" width="74" height="42" rx="4" fill="#3d4f63"/>
<rect x="243" y="322" width="64" height="34" rx="2" fill="#8fbfe0"/>
<rect x="248" y="330" width="30" height="4" rx="1" fill="#ffffff"/>
<rect x="248" y="338" width="45" height="4" rx="1" fill="#ffffff"/>
<rect x="248" y="346" width="20" height="4" rx="1" fill="#ffffff"/>
</g>

<!-- sticky notes -->
<g transform="rotate(-8 100 140)">
<rect x="60" y="100" width="80" height="80" fill="#f5d76e"/>
<text x="100" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#7a5c00">HTML</text>
<text x="100" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7a5c00">structure</text>
</g>

<g transform="rotate(6 400 130)">
<rect x="360" y="90" width="80" height="80" fill="#8fd0b0"/>
<text x="400" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1f5c3f">CSS</text>
<text x="400" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1f5c3f">styling</text>
</g>

<g transform="rotate(-4 380 250)">
<rect x="345" y="215" width="70" height="70" fill="#f2a2a2"/>
<text x="380" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#7a1f1f">life</text>
<text x="380" y="266" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#7a1f1f">set!</text>
</g>

<g transform="rotate(5 90 250)">
<rect x="55" y="215" width="70" height="70" fill="#9fc8ec"/>
<text x="90" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1f3f5c">practice</text>
<text x="90" y="266" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1f3f5c">daily</text>
</g>

<!-- thought cloud above head -->
<circle cx="330" cy="180" r="6" fill="#e6eaee"/>
<circle cx="342" cy="168" r="9" fill="#e6eaee"/>
<ellipse cx="368" cy="150" rx="30" ry="24" fill="#e6eaee"/>
<text x="368" y="145" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#5a6b7a">&lt;/&gt;</text>
<text x="368" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5a6b7a">coding...</text>

</svg>
